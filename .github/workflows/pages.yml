# Publica la carpeta web/ en GitHub Pages (rama gh-pages) cada vez que cambia.
name: Publicar en GitHub Pages
on:
  push:
    branches: [main, ccr-a1c6b817-w1plzj]
    paths: ["web/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: pages
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests de las reglas del modo gratuito
        run: node --test tests/reglas.test.js
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
